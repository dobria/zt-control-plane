name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: dobria/zt-control-plane

jobs:
  verify:
    if: github.repository == 'dobria/zt-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag and package version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "v${package_version}" != "$GITHUB_REF_NAME" ]]; then
            echo "package.json version ${package_version} does not match ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build release candidate for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: zt-control-plane:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block release on fixed critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zt-control-plane:release-candidate
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          timeout: 10m

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ZT Control Plane
            org.opencontainers.image.description=Independent multi-provider ZeroTier network control plane
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/docs
            org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-only

      - name: Publish standard image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Verify published registry tags
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"

          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "$version" "$minor" latest; do
              reference="${image}:${tag}"
              actual_digest=""

              for attempt in 1 2 3 4 5; do
                if inspect_output="$(docker buildx imagetools inspect "$reference" 2>/dev/null)"; then
                  actual_digest="$(
                    awk '$1 == "Digest:" { print $2; exit }' <<< "$inspect_output"
                  )"
                else
                  actual_digest=""
                fi

                if [[ "$actual_digest" == "$PUBLISHED_DIGEST" ]]; then
                  break
                fi

                sleep "$((attempt * 2))"
              done

              if [[ "$actual_digest" != "$PUBLISHED_DIGEST" ]]; then
                echo "${reference} resolved to ${actual_digest:-no digest}; expected ${PUBLISHED_DIGEST}." >&2
                exit 1
              fi

              echo "Verified ${reference}@${actual_digest}"
            done
          done

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub release for ${GITHUB_REF_NAME} already exists." >&2
            exit 1
          fi

          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            cp "$notes_file" release-notes.md
            printf '\n## Container image digest\n\n`%s`\n' "$IMAGE_DIGEST" >> release-notes.md
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ZT Control Plane ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ZT Control Plane ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
